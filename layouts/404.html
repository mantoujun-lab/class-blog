{{- /*
  Custom 404 page. Renders a minimal, self-contained page when no
  other route matches. Kept intentionally simple so it works even if
  the theme's base layout changes.
*/ -}}
<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "zh-cn" }}">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
  <title>404 — 页面未找到 | {{ .Site.Title }}</title>
  <meta name="description" content="请求的页面不存在。返回首页继续浏览 {{ .Site.Title }}。" />
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="{{ .Site.BaseURL }}" />
  <link rel="icon" href="{{ .Site.Params.favicon | default "/favicon.png" | absURL }}" />
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #fafafa; color: #222; }
    main { max-width: 480px; padding: 2rem; text-align: center; }
    h1 { font-size: 4rem; margin: 0; color: #888; }
    h2 { font-size: 1.4rem; margin: 1rem 0; }
    p { line-height: 1.7; color: #555; }
    a { color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .actions { margin-top: 1.5rem; }
    .actions a { display: inline-block; padding: 0.6rem 1.2rem; background: #2563eb; color: #fff; border-radius: 6px; }
    .actions a:hover { background: #1d4ed8; text-decoration: none; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <h2>页面未找到</h2>
    <p>很抱歉，你访问的页面不存在或已被移动。</p>
    <p>可能的原因：链接已过期、文章已被归档，或输入的 URL 有误。</p>
    <div class="actions">
      <a href="{{ "/" | relURL }}">返回首页</a>
    </div>
  </main>
</body>
</html>

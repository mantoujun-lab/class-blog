# 站点全局配置
baseURL = "https://blog.hjx-25pc1.xyz/"
defaultContentLanguage = "zh-cn"
locale = "zh-cn"
hasCJKLanguage = true
title = "班级博客"
theme = "hugo-theme-stack"
copyright = "mantoujun's Lab"

# 动态生成 robots.txt（基于 baseURL，避免硬编码站点域名）
enableRobotsTXT = true

# 分页
[pagination]
    pagerSize = 10

# 永久链接（短链接风格）
[permalinks]
    post = "/p/:slug/"
    page = "/:slug/"

# SEO 配置
[sitemap]
    changefreq = "weekly"
    filename = "sitemap.xml"
    priority = 0.5

# 启用 RSS 输出（提升可发现性）
[outputs]
    home = ["HTML", "RSS"]
    section = ["HTML", "RSS"]

# Markdown 渲染 / 代码高亮 / 目录
[markup]
    [markup.goldmark]
        [markup.goldmark.extensions]
            [markup.goldmark.extensions.passthrough]
                enable = true
                [markup.goldmark.extensions.passthrough.delimiters]
                    block = [["\\[", "\\]"], ["$$", "$$"]]
                    inline = [["\\(", "\\)"]]
        [markup.goldmark.renderer]
            unsafe = true
    [markup.tableOfContents]
        endLevel = 4
        ordered = true
        startLevel = 2
    [markup.highlight]
        noClasses = false
        codeFences = true
        guessSyntax = true
        lineNoStart = 1
        lineNos = true
        lineNumbersInTable = true
        tabWidth = 4

[taxonomies]
    category = "categories"
    tag = "tags"
    author = "authors"

# 主题参数
[params]
    favicon = "/favicon.png"
    mainSections = ["post"]
    rssFullContent = true

    # SEO 默认值（可在页面 front matter 中覆盖）
    description = "25级计算机应用1班班级博客，记录学习与生活的点滴"
    keywords = ["班级博客", "计算机应用", "Hugo", "学习笔记"]
    author = "mantoujun's Lab"
    image = "/favicon.png"
    robots = "index, follow"

    [params.footer]
        since = 2026

    [params.sidebar]
        subtitle = "25级计算机应用1班"

    [params.article]
        [params.article.license]
            enabled = true
            default = "Licensed under MIT"

    [params.widgets]
        homepage = [
            { type = "search" },
            { type = "archives", params = { limit = 5 } },
            { type = "categories", params = { limit = 10 } },
            { type = "tag-cloud", params = { limit = 10 } },
        ]
        page = [{ type = "toc" }]

    [params.comments]
        enabled = true
        provider = "waline"

        [params.comments.waline]
            serverURL = "https://waline.mantoujun-lab.com"
            lang = "zh-CN"
            emoji = ["https://unpkg.com/@waline/emojis@1.4.0/tw-emoji"]
            requiredMeta = ["nick"]
            visitor = true
            reaction = true

    [params.cookies]
        enabled = false

# 侧边栏社交链接
[[menu.social]]
    identifier = "home"
    name = "主站"
    url = "https://hjx-25pc1.xyz"
    [menu.social.params]
        icon = "home"

[[menu.social]]
    identifier = "github"
    name = "GitHub"
    url = "https://github.com/mantoujun-lab"
    [menu.social.params]
        icon = "brand-github"
